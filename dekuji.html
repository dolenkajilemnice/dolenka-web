<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Děkujeme — Dolenka Jilemnice</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #F7F7F5;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; }
    .wrap { text-align: center; max-width: 480px; padding: 2rem; }
    .icon { width: 64px; height: 64px; background: #25CC30;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 2rem; }
    .icon svg { width: 32px; height: 32px; stroke: #292C33;
                fill: none; stroke-width: 2.5; }
    h1 { font-size: 2rem; font-weight: 600; color: #292C33;
         margin-bottom: 1rem; letter-spacing: -0.02em; }
    p { color: #5A5E66; font-size: 16px; line-height: 1.7;
        margin-bottom: 2rem; }
    a { display: inline-block; background: #292C33; color: #fff;
        padding: 13px 28px; text-decoration: none; font-size: 13px;
        font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
    a:hover { background: #25CC30; color: #292C33; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <h1>Děkujeme za zájem!</h1>
    <p>František Petrouš vás bude kontaktovat do 24 hodin
    v pracovní dny — telefonicky nebo emailem.</p>
    <a href="/">Zpět na web</a>
  </div>
</body>
</html>
