popis: |
  Byt 7 se nachází v prostředním patře domu. Z předsíně procházíte kolem samostatného WC a koupelny se sprchovým koutem do obývacího pokoje s kuchyňským koutem a příjemným západním výhledem na město Jilemnice.

  Prostorná ložnice nabízí místo i pro menší pracovní kout. Francouzské dveře Vás z ložnice zavedou na vlastní terasu obklopenou zelenou střechou, kde si užijete soukromí, výhled i klid nad okolním děním. K bytu náleží také parkovací stání.
