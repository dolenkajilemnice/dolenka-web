popis: |
  Byt č. 8 je největší jednotkou v projektu — prostorný 3+kk na druhém podlaží s dispozicí, která funguje pro rodinu i pro dva lidi, kteří potřebují pracovnu nebo pokoj pro hosty. Orientace do tiché části dvorního traktu zajišťuje klid a přirozené světlo po většinu dne.

  Kuchyně je průchodně propojena s obývacím prostorem. Obě ložnice jsou oddělené, každá s dostatečným místem pro šatní skříň. Koupelna je navržena bez kompromisů — velkoformátová španělská dlažba, prostorná sprchová kabina a dostatečný prostor pro pračku a sušičku.

  Provoz bytu je díky energetickému celku budovy — fotovoltaice, tepelnému čerpadlu a rekuperaci — výrazně levnější než u srovnatelných bytů.
