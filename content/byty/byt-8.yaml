popis: |
  Byt 8 je největší prodávaný byt v projektu a nabízí dispozici 3+kk s orientací na východ i západ. Z předsíně s místem pro šatní skříň a botník procházíte kolem samostatného WC a koupelny se sprchovým koutem do obývacího pokoje s kuchyňskou linkou.

  Z obytné části vstupujete na balkón s výhledem před dům a západním sluncem. Ložnice má vlastní terasu orientovanou do klidnější části se zelení a další pokoj může sloužit jako dětský pokoj, pracovna nebo pokoj pro hosty. K bytu náleží také sklep v přízemí a parkovací stání.
