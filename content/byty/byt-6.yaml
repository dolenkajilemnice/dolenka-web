popis: |
  Do bytu 6 vystoupáte jedno patro po schodech. V předsíni pohodlně umístíte botník i věšáky na kabáty a dále navazuje samostatné WC, koupelna se sprchovým koutem a obytná část s kuchyňskou linkou.

  Hlavní místnost nabízí příjemný výhled do zahrady. Ložnice je oddělená od obývací části posuvnými dveřmi a díky aktivnímu přívodu čerstvého vzduchu vytváří klidné místo pro spánek. K bytu náleží také parkovací stání.
