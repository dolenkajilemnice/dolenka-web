popis: |
  Po vstupu do budovy Vás první dveře vpravo zavedou do bytu 4. V předsíni je dostatek místa na kabáty, botník i kočárek. Odtud vstupujete do prostorné obytné místnosti s kuchyňským koutem a francouzskými dveřmi na vlastní terasu.

  Za kuchyňskou částí navazuje klidnější zóna bytu se samostatným WC, koupelnou se sprchovým koutem a ložnicí orientovanou na opačnou stranu domu. Terasa je prakticky umístěná hned vedle parkovacího stání, které k bytu náleží.
