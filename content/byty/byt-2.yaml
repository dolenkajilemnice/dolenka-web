popis: |
  Po vstupu do budovy Vás první dveře vlevo zavedou do bytu 2. V předsíni je prostor pro botník i šatní skříň a dále vstupujete do prostorné obytné místnosti s kuchyňským koutem.

  Francouzské dveře propojují hlavní místnost s vlastní terasou. V zadní části bytu najdete další úložný prostor, samostatné WC a koupelnu s možností pohodlného sprchování i relaxace ve vířivce. K bytu náleží také parkovací stání.
