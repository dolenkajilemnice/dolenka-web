popis: |
  Byt 9 se nachází ve 3. NP a odmění Vás krásným výhledem na okolí. V předsíni je místo pro šatní skříň i věšáky na kabáty a dále procházíte kolem koupelny s vanou a samostatného WC do obývacího pokoje s kuchyňským koutem.

  Z obývací části vstupujete na vlastní terasu s výhledem do zahrady i na domy na kopci. Okna na opačné straně bytu směřují k parkovišti, stejně jako ložnice. Praktickým bonusem je komora v přízemí a k bytu náleží také parkovací stání.
