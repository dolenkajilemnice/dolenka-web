popis: |
  Byt 10 se nachází ve 3. NP a nabízí praktickou dispozici 2+kk s prostornou předsíní. Pohodlně sem umístíte šatní skříň i botník a dále navazuje samostatné WC, koupelna s vanou a obývací pokoj s kuchyňskou linkou.

  Podkrovní charakter bytu připomíná sloup v obytné části, který ale nebrání praktickému rozmístění nábytku. Ložnice nabízí prostor pro další šatní skříň a výhled na přední stranu domu. O patro níže k bytu náleží komora pro sezónní vybavení a samozřejmostí je také parkovací stání.
