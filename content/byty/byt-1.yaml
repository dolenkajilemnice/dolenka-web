popis: >
  Do bytu 1 vstupujete vlastním vchodem přímo z parkoviště, okolo své soukromé
  terasy. V předsíni pohodlně odložíte kabát a hned navazuje samostatné WC i
  koupelna s vanou.


  Hlavní obytný prostor nabízí kuchyňský kout, místo pro jídelní stůl i sedací soupravu u okna. Ložnice je připravená na manželské dvoulůžko a dostatek úložného prostoru doplňuje praktická šatna. K bytu náleží kromě vlastní terasy i parkovací stání.
